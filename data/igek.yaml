# Napi igék rotációhoz a kezdőlapra (brief/igek.rtf alapján)
- text: "De ha újra meggondolom, reménykedni kezdek. Szeret az ÚR…"
  ref: "Jer Sir 3:21–22"
- text: "A reménység pedig nem szégyenít meg…"
  ref: "Róm 5:5"
- text: "Csak Istennél csendesül el lelkem, tőle kapok reménységet."
  ref: "Zsolt 62:6"
- text: "Reménykedhetsz a jövőben – így szól az ÚR…"
  ref: "Jer 31:17"
- text: "Jó az ÚR a benne reménykedőkhöz, a hozzá folyamodókhoz."
  ref: "Jer Sir 3:25"
- text: "Uram, kegyelmezz nekünk, benned reménykedünk!"
  ref: "Ézs 33:2"
- text: "De én az Urat várom, a szabadító Istenben reménykedem: meg is fog hallgatni Istenem!"
  ref: "Mik 7:7"
- text: "…mit várhatok, Uram? Egyedül benned reménykedem!"
  ref: "Zsolt 39:8"
- text: "Reménykedj az Úrban, maradj az ő útján! Ő felmagasztal, és öröklöd a földet…"
  ref: "Zsolt 37:34"
- text: "…Reménykedj az Úrban, ő megsegít téged."
  ref: "Péld 20:22"
- text: "Mert benned reménykedem, Uram, te majd megfelelsz nekik, Uram, Istenem!"
  ref: "Zsolt 38:16"
- text: "Hiszen azért fáradunk és küzdünk, mert az élő Istenben reménykedünk…"
  ref: "1Tim 4:10"
- text: "Reménykedj az Úrban, légy erős és bátor szívű, reménykedj az Úrban!"
  ref: "Zsolt 27:14"
- text: "Mert a szegény nem lesz végképen elfelejtve, a nyomorultak reménye sem vész el örökre."
  ref: "Zsolt 9:19"
